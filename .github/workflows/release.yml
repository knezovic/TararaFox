name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # push the docs/ update + create the GitHub release (notes only)

# Not shared with the Publish approved version workflow: GitHub keeps only one
# pending run per group and cancels the older one, which could drop a release.
# publish-site.sh is idempotent, so the two may overlap safely.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind a release tag, so a moved or
      # compromised tag cannot change what runs with this repo's secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, needed to check the tag is on main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a job that holds the AMO signing secrets: a
          # poisoned cache entry could run code with them. npm ci is quick here.
          package-manager-cache: false

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "VERSION=${MANIFEST_VERSION}" >> "$GITHUB_ENV"

      # Checked before signing: publishing commits on top of main, so a tag on
      # a commit that is not on main would otherwise drag that commit onto main.
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Push the commit to main first, then tag it."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Unlisted versions are usually signed within minutes, but AMO can hold
      # one for manual review. Wait up to an hour; if it is still pending then,
      # finish without publishing: a version already submitted cannot be
      # uploaded again, and the "Publish approved version" workflow (hourly)
      # publishes it once AMO approves it.
      - name: Sign (unlisted) via AMO
        id: sign
        timeout-minutes: 75
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set +e
          npx web-ext sign \
            --channel=unlisted \
            --approval-timeout=3600000 \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET" 2>&1 | tee "$RUNNER_TEMP/sign.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "Approval: timeout exceeded" "$RUNNER_TEMP/sign.log"; then
              echo "::notice::AMO is still reviewing v${VERSION}. The Publish approved version workflow publishes it once it is approved (it checks hourly)."
              echo "pending=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi

      - name: Publish to GitHub Pages + GitHub release
        if: steps.sign.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-site.sh "$VERSION" "$(ls web-ext-artifacts/*.xpi | head -n1)"
