name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # push the docs/ update + create the GitHub release (notes only)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind a release tag, so a moved or
      # compromised tag cannot change what runs with this repo's secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, needed to check the tag is on main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a job that holds the AMO signing secrets: a
          # poisoned cache entry could run code with them. npm ci is quick here.
          package-manager-cache: false

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "VERSION=${MANIFEST_VERSION}" >> "$GITHUB_ENV"

      # Checked before signing: publishing commits on top of main, so a tag on
      # a commit that is not on main would otherwise drag that commit onto main.
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Push the commit to main first, then tag it."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Unlisted versions are usually signed within minutes, but AMO can hold
      # one for review; web-ext's default 15 min wait then fails the release
      # after the version was already submitted (it cannot be re-uploaded).
      # Wait up to an hour instead.
      - name: Sign (unlisted) via AMO
        timeout-minutes: 75
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --channel=unlisted \
            --approval-timeout=3600000 \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      # GitHub Releases reject .xpi as an asset, so the signed xpi is hosted on
      # GitHub Pages (alongside updates.json) instead. Pages serves the docs/
      # directory from the main branch (Settings → Pages → Deploy from a branch
      # → main → /docs). docs/ becomes the site root, so the URLs in updates.json
      # and the manifest's update_url stay root-relative. The files are built in
      # a temp dir first and copied onto the latest main in the next step.
      # update_hash lets Firefox verify the downloaded xpi before installing it.
      - name: Build site files (signed xpi + update manifest + landing page)
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          XPI="$(ls web-ext-artifacts/*.xpi | head -n1)"
          cp "$XPI" "$SITE/tarara-${VERSION}.xpi"
          HASH="$(sha256sum "$SITE/tarara-${VERSION}.xpi" | cut -d' ' -f1)"
          cat > "$SITE/updates.json" <<EOF
          {
            "addons": {
              "tarara@tararafox": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://knezovic.github.io/TararaFox/tarara-${VERSION}.xpi",
                    "update_hash": "sha256:${HASH}"
                  }
                ]
              }
            }
          }
          EOF
          cat > "$SITE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Tarara</title>
          </head>
          <body>
          <h1>Tarara</h1>
          <p>Self-hosted update channel for the Tarara Firefox extension (unlisted on AMO).</p>
          <h2>Latest release &mdash; v${VERSION}</h2>
          <ul>
          <li><a href="tarara-${VERSION}.xpi">Signed xpi (tarara-${VERSION}.xpi)</a></li>
          <li><a href="updates.json">Update manifest (updates.json)</a></li>
          </ul>
          <p>To install: open the xpi in Firefox (drag it into a tab, or use <code>about:addons</code> &rarr; gear icon &rarr; &ldquo;Install Add-on From File&rdquo;). Updates are delivered automatically via the manifest.</p>
          </body>
          </html>
          EOF

      # Commit onto the latest main (not the tag checkout), so pushes made to
      # main while the release ran are kept. Retries if main moves meanwhile.
      - name: Commit docs/ onto main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish origin/main
            mkdir -p docs
            cp "$RUNNER_TEMP/site/tarara-${VERSION}.xpi" "$RUNNER_TEMP/site/updates.json" "$RUNNER_TEMP/site/index.html" docs/
            git add "docs/tarara-${VERSION}.xpi" docs/updates.json docs/index.html
            git commit -m "Publish v${VERSION}: signed xpi + updates.json + index.html to docs/ (GitHub Pages)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the release (attempt ${attempt}), retrying"
            sleep 5
          done
          echo "::error::Could not push the docs/ update to main after 3 attempts"
          exit 1

      - name: Create GitHub release (notes only; xpi lives on Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Tarara v${VERSION}. Signed xpi: https://knezovic.github.io/TararaFox/tarara-${VERSION}.xpi" \
            --verify-tag
